services:
  stormraven-macos-vm:
    image: dockurr/macos:latest
    container_name: stormraven-macos-xcode
    environment:
      VERSION: "15"
      RAM_SIZE: "8G"
      CPU_CORES: "4"
      DISK_SIZE: "64G"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "127.0.0.1:8006:8006"
      - "127.0.0.1:5900:5900"
      - "127.0.0.1:2223:22"
    volumes:
      - ./macos-storage:/storage
    restart: unless-stopped
