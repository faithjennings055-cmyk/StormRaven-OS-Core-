name: Build & Sign StormRaven iOS (.ipa)

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'iOS Bundle Identifier'
        required: false
        default: 'org.starforge.stormraven.os'
      team_id:
        description: 'Apple Developer Team ID (optional if using ad-hoc / AltStore / Sideloadly)'
        required: false
        default: ''
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-signed-ipa.yml'

jobs:
  build-macos-ipa:
    name: Cloud macOS Xcode 16 Build & Sign (.ipa)
    runs-on: macos-15
    steps:
      - name: Checkout StormRaven-OS-Core-
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Package & Sign StormRavenCompanion.ipa
        env:
          BUNDLE_ID: ${{ github.event.inputs.bundle_id || 'org.starforge.stormraven.os' }}
          APPLE_TEAM_ID: ${{ github.event.inputs.team_id || secrets.APPLE_TEAM_ID || '' }}
          APPLE_P12_BASE64: ${{ secrets.APPLE_P12_BASE64 || '' }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD || '' }}
          APPLE_PROVISION_BASE64: ${{ secrets.APPLE_PROVISION_BASE64 || '' }}
        run: |
          bash ios/StormRavenCompanion/scripts/cloud-build-and-sign.sh

      - name: Upload StormRavenOS Signed/Compiled .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StormRavenOS-iOS-ipa
          path: |
            ios/StormRavenCompanion/build/StormRavenOS.ipa
            ios/StormRavenCompanion/build/StormRavenOS.ipa.sha256
          retention-days: 30
